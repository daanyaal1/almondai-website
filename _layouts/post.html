<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #faf3e0;
      color: #333;
      line-height: 1.6;
    }
    header, footer {
      background-color: #a0522d;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    nav ul {
      list-style-type: none;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    nav ul li {
      margin: 0 15px;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .content {
      margin-top: 20px;
    }
    footer a {
      color: #d2691e;
    }
  </style>
</head>
<body>
  {% include header.html %}
  {% include navigation.html %}
  <main>
    <article>
      <h1>{{ page.title }}</h1>
      <p><small>Posted on {{ page.date }}</small></p>
      <div class="content">
        {{ content }}
      </div>
    </article>
  </main>
  {% include footer.html %}
</body>
</html>
